name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installa dipendenze
        run: npm install

      - name: Audit sicurezza
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Verifica bundle generato
        run: |
          if [ ! -f dist/bundle.js ]; then
            echo "❌ dist/bundle.js non trovato"
            exit 1
          fi
          echo "✓ dist/bundle.js generato ($(du -sh dist/bundle.js | cut -f1))"
